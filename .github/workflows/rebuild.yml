name: Rebuild charts

# Manual only: gh workflow run rebuild.yml   (add -f force_full=true to ignore the extract cache)
# Re-runs extract (cached by file version), verify_opm, build and the checks, then opens a PR with the regenerated
# charts/ and checks/. Never pushes to the branch it runs on.
on:
  workflow_dispatch:
    inputs:
      force_full:
        description: "Ignore the extract cache and read every file again (hours)"
        type: boolean
        default: false

concurrency:
  group: rebuild-charts
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Cache of data/cache/ (one small aggregate per source file and query, named by file version). The key holds the
      # hash of extract.py and config.py, because the cached SQL lives there; restore-keys only match the same hash.
      # Saved under a new key each run (a cache key cannot be overwritten), also after a failed extract, so progress is kept.
      - name: Restore extract cache
        id: restore
        if: ${{ !inputs.force_full }}
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: extract-${{ hashFiles('extract.py', 'config.py') }}-${{ github.run_id }}
          restore-keys: |
            extract-${{ hashFiles('extract.py', 'config.py') }}-

      - name: Cache status
        run: |
          mkdir -p data/cache
          n=$(find data/cache -name '*.parquet' | wc -l)
          echo "cache files restored: $n (force_full=${{ inputs.force_full }}, hit: '${{ steps.restore.outputs.cache-matched-key }}')" | tee -a "$GITHUB_STEP_SUMMARY"

      # extract.py is resumable; its own step timeout leaves time for verify, build and the checks (job limit 350 min).
      - name: Extract (OPM EHRI from Hugging Face)
        timeout-minutes: 270
        run: python extract.py

      - name: Drop half-written cache files
        if: ${{ always() }}
        run: find data/cache -name '*.tmp.parquet' -delete 2>/dev/null || true

      - name: Save extract cache
        if: ${{ always() && hashFiles('data/cache/*.parquet') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: extract-${{ hashFiles('extract.py', 'config.py') }}-${{ github.run_id }}

      - name: Verify every file against OPM (SHA-256)
        run: python verify_opm.py

      - name: Build charts, tables and facts.md (also runs check_literals.py)
        run: python build.py

      - name: Spot check against OPM's raw files
        run: python spot_check.py

      - name: Check that no digit is typed into chart text
        run: python check_literals.py

      - name: Open a PR with the regenerated outputs
        env:
          RUN_ID: ${{ github.run_id }}
          BASE_REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          CACHE_NOTE: "restored key '${{ steps.restore.outputs.cache-matched-key }}', force_full=${{ inputs.force_full }}"
        run: bash .github/scripts/regen_pr.sh

      - name: Job summary
        if: ${{ always() }}
        run: |
          {
            echo "### Rebuild finished with status: ${{ job.status }}"
            echo "- Python $(python --version 2>&1), duckdb $(python -c 'import duckdb; print(duckdb.__version__)')"
            echo "- Cache files now in data/cache: $(find data/cache -name '*.parquet' 2>/dev/null | wc -l)"
            echo "- checks/spot_check.md written: $([ -f checks/spot_check.md ] && echo yes || echo no)"
          } >> "$GITHUB_STEP_SUMMARY"
